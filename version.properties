# CrossSafe Auto-Versioning Configuration
#
# Major version: Increment for breaking changes or major features
# Minor version: Increment for new features
# Patch version: Increment for bug fixes
#
# The build system will automatically generate:
# - versionCode: Auto-incremented based on build timestamp
# - versionName: major.minor.patch-build.YYYYMMDD.HHMM

MAJOR_VERSION=1
MINOR_VERSION=0
PATCH_VERSION=0

# Versioning Strategy:
# - versionCode: Unique integer that increases with each build
#   Formula: (days_since_epoch * 1000) + (minutes_in_day % 1000)
#   This ensures:
#   * Each day starts with a higher base number
#   * Multiple builds per day get unique incrementing codes
#   * Maximum ~1000 builds per day supported
#
# - versionName: Semantic versioning with build info
#   Format: MAJOR.MINOR.PATCH-build.YYYYMMDD.HHMM
#   Example: 1.0.0-build.20260514.1430
#
# When to increment:
# - MAJOR: Breaking changes, major redesign
# - MINOR: New features added
# - PATCH: Bug fixes, small improvements

